<header class="header">
    <div class="fixed">
        <div style="display: flex;">
            <h1><a href="/SatoshinTechBlog/">{{ site.title }}</a></h1>
        </div>
        <div class="fixed-list">
            <div class="menu">
                <p>Newest</p>
                <div class="menu-content">
                    <ul>
                        {% for post in site.posts limit:5 %}
                        <li><a href="{{ post.url | relative_url}}">{{ post.title }}</a></li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <p class="movable">{{ site.description }}</p>
</header>
